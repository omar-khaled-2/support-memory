services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ingest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingest:
    build: ./ingest-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ingest
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      PUBLISH_INTERVAL_SECONDS: 5
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  memory:
    build: ./mermory-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/memory
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      CONSUME_INTERVAL_SECONDS: 5
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  query:
    build: ./query-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8002
      MEMORY_SERVICE_URL: http://memory:8001/api/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.0}
    depends_on:
      memory:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ingest
      - memory
      - query

volumes:
  postgres_data:
